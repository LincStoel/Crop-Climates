modLoader = "javafml"
loaderVersion = "[4,)"
license = "AGPL-3.0-or-later"

[[mods]]
modId = "crop_climates"
version = "${file.jarVersion}"
displayName = "Crop Climates"
description = '''
Climate-driven crop growth. Every growable block has an ideal temperature and
humidity band, and how well its spot matches them scales its growth from 1.25x
down to a crawl - far enough outside, crops slowly wilt back a stage and
saplings die off. Temperature is read live from Cold Sweat, so hearths and
iceboxes shape a farm's climate. Rain raises humidity where it actually falls.
Hang a Hygrometer inside a sealed room to turn it into a greenhouse: water and
wet sponges humidify it, lava and dry sponges dry it out, and every crop inside
grows by the room's humidity instead of the biome's. Submerged aquatic crops
ignore humidity and sunlight. Per-crop bands ship as datapacks
that skip silently when the owning mod is absent. Cold Sweat is the only hard
dependency; Jade support is optional.
'''

[[mixins]]
config = "crop_climates.mixins.json"

[[dependencies.crop_climates]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.181,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.crop_climates]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"

[[dependencies.crop_climates]]
modId = "cold_sweat"
type = "required"
versionRange = "[2.4.3,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.crop_climates]]
modId = "jade"
type = "optional"
versionRange = "[15,)"
ordering = "NONE"
side = "BOTH"
