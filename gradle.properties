org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true

# Path to the Cold Sweat jar to compile against (compileOnly - not shaded, not
# on the runtime classpath for runClient/runServer). Override on the command
# line with -PcoldSweatJar=<path> if it lives somewhere else, e.g.:
#   C:/Users/linco/curseforge/minecraft/Instances/World Traveler 2/mods/ColdSweat-2.4.3.jar
# Default (relative to this file, gitignored): libs/ColdSweat-2.4.3.jar

# Path to the Jade jar to compile the optional Jade plugin against (compileOnly -
# the plugin class is only ever loaded by Jade's own plugin discovery, so the mod
# still runs without Jade). Copy it from the instance's mods/ folder, or override
# with -PjadeJar=<path>. Default (gitignored): libs/Jade-1.21.1-NeoForge-15.10.6.jar
